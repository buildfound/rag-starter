services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag_starter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_starter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
